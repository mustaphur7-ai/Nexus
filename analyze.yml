name: Run Gold Options Analysis

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run options analysis
        run: node scripts/analyze.mjs

      - name: Commit updated analysis.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update options analysis from same source"
            git push
          fi
